<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Selektor dziecka</title>
	<style>
		div > p{
			color:blue;
		}
	</style>
</head>
<body>

<p>Tylko dzieci diva będą kolorowe</p>

<div>
  <p>Paragraph 1 in the div.</p>
  <p>Paragraph 2 in the div.</p>
  <section><p>Paragraph 3 in the section.</p></section>
</div>

</body>
</html>
