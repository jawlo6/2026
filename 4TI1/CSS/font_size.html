<!DOCTYPE html>
<html>
<head>
<style>
p.f16 {
  font-size: 16px;
}

p.xx_small {
  font-size: xx-small;
}

p.p200p {
  font-size: 200%;
}

p.vw {
  font-size: 10vw;
}
</style>
</head>
<body>

<p class="f16">font size 16px</p>
<p class="xx_small">xx-small </p>
<p class="p200p">200% This is a third paragraph.</p>
<p class="vw">10vw This is a fourth paragraph.</p>

</body>
</html>
