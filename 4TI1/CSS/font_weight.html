<!DOCTYPE html>
<html>
<head>
<style>
p.normal {
  font-weight: normal;
}

p.light {
  font-weight: lighter;
}

p.thick {
  font-weight: bold;
}

p.thicker {
  font-weight: 900;
}
</style>
</head>
<body>

<h1>The font-weight property</h1>

<h1>The font-weight property</h1>
<p class="normal">This is normal.</p>
<p class="light">This is light.</p>
<p class="thick">This is thick.</p>
<p class="thicker">This is thicker.</p>

</body>
</html>
