<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="utf-8">
        <title>Listy</title>
    </head>
    <body>
        <h1>Lista nieuporządkowana</h1>
        <ul style="list-style-type:circle ">
            <li>masło</li>
            <li>mleko</li>
            <li>bułki</li>
        </ul>
        <h1>Lista numerowana:</h1>
        <ol start="10" type="A">
            <li>pierwszy</li>
            <li>drugi</li>
            <li>trzeci</li>
        </ol>
        <h1>listy mieszane</h1>
        <ol>
            <li>tea:</li>
                <ul>
                    <li>white,</li>
                    <li>green,</li>
                    <li>black</li>
                </ul>
            <li>coffee:</li>
                <ul>
                    <li>white</li>
                    <li>black</li>
                </ul>
        </ol>
        <h1>lista opisowa (słownikowa)</h1>
        <dl>
            <dt>termin1</dt>
                <dd>opis terminu</dd>
            <dt>termin2</dt>
                <dd>opis terminu2</dd>
        </dl>
    </body>
</html>
