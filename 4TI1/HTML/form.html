<!DOCTYPE html>
<html lang="pl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Formularze</title>
</head>
<body>
	<form>
		<label for="fname">Wpisz swoje imię:</label>

		<label>nazwisko
			<input type="text">
		</label><br>

			<textarea 
				rows="4"
				cols="20">
				wpisz tutaj treść komentarza
			</textarea>
		</label><br>

		<input type="checkbox" id="vehicle2" value="Car">
		<label for="vehicle2">I have a car</label><br>

		<br>

		<input type="reset">
		
		
    </form>

</html>
