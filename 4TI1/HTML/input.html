<!DOCTYPE html>
<html lang="pl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>input</title>
</head>
<body>
	<form>
        <label for="name">wpisz imię:</label>
        <input type="text" id="name"><br>
        
        <label for="password">wpisz hasło:</label>
        <input type="password" id="password"><br>
        
        <label for="wiek">wpisz wiek:</label>
        <input 
               type="number" 
               id="wiek"
               min="0"
               max="120"><br>
        
        <label for="data_ur">data urodzenia:</label>
        <input 
               type="date" 
               id="data_ur" 
               min="2000-01-01"
               max="2026-12-30"><br>
        
        
        <label for="obraz">Obraz jako submit:</label>
        <input 
               type="image" 
               src="images.jpg"
               id="obraz" 
               width="40"
               height="30"><br>
        
        <label for="myfile">wybierz plik</label>
        <input 
               type="file" 
               id="myfile" 
               ><br>
        
        
        
        <label for="zakres">Volume: od 0</label>
        <input 
               type="range" 
               id="zakres" 
               min="0"
               max="100"
               >100<br>
        
        <label for="czas">wybierz czas</label>
        <input 
               type="time" 
               id="czas" 
               ><br>
        
        <label for="kolor">wybierz kolor</label>
        <input 
               type="color" 
               id="kolor" 
               ><br>
        
        
        <label for="ukryty">pole ukryte</label>
        <input 
               type="hidden" 
               id="ukryty" 
               value="1234"
               >
        tekst
        
        
        
        
        
    </form>
</body>
</html>
