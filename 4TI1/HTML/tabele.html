<!DOCTYPE html>
<html lang="pl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tabele</title>
    <style>
        table, th,td {
            border:1px solid red;
            
            border-radius: 10px;
        }  
    </style>
</head>
<body>
	<table width="100%">
        <caption>tytuł tabeli</caption>
        <tr><th>LP</th><th colspan="2">Imię</th></tr>
        <tr><th rowspan="2">1</th><td>Adam</td><td>40</td></tr>
        <tr><td>Janusz</td><td>18</td></tr>
        
    </table>
</body>
</html>
